name: Tests and reproducible figures
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_analysis:
        description: Refit primary models and all four sensitivity analyses
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          enable-cache: true
      - run: uv sync --frozen --python 3.13
      - run: uv run --frozen pytest --cov=cervical_biopsy_modeling --cov-report=xml
      - name: Reproduce figures from published tables in an isolated directory
        run: uv run --frozen python -m cervical_biopsy_modeling.reproduce --mode figures --output-dir "$RUNNER_TEMP/figures"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-figures-and-coverage
          path: |
            ${{ runner.temp }}/figures/reports/figures/
            ${{ runner.temp }}/figures/run_record.json
            coverage.xml
          if-no-files-found: error
  full-analysis:
    if: github.event_name == 'workflow_dispatch' && inputs.full_analysis
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          enable-cache: true
      - run: uv sync --frozen --python 3.13
      - run: uv run --frozen python -m cervical_biopsy_modeling.reproduce --mode full --output-dir "$RUNNER_TEMP/full-analysis"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-nested-validation
          path: |
            ${{ runner.temp }}/full-analysis/reports/
            ${{ runner.temp }}/full-analysis/logs/
            ${{ runner.temp }}/full-analysis/run_record.json
          if-no-files-found: error
